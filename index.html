<html lang="en">

    <meta charset="UTF-8" />

    <meta property="og:title" content="The Frame Cut Studio" />
    <meta property="og:description" content="Premium Wedding Video Editing Management System (ERP) with Gemini AI Wedding Creative Tools, soundtrack curation, and social reels generator." />
    <script>
      (function() {
        function isBenign(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.includes('websocket') || s.includes('vite') || s.includes('hmr') || s.includes('closed without opened');
        }
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason && e.reason.message ? e.reason.message : e.reason);
          if (isBenign(reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message));
          if (isBenign(msg)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
